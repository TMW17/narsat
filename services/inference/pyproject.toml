[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "narsat-inference"
version = "0.1.0"
description = "Burn-scar segmentation service for NarSat (Prithvi-EO-2.0 via TerraTorch)"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.14"
# The service itself is small. The model stack is an extra so that the HTTP contract
# and the tiling logic can be tested without installing PyTorch.
dependencies = [
  "fastapi>=0.162,<1",
  "uvicorn[standard]>=0.54,<1",
  "numpy>=2.5,<3",
  "pydantic-settings>=2.16,<3",
]

[project.optional-dependencies]
prithvi = [
  "torch>=2.15,<3",
  "terratorch>=1.2.14,<1.3",
  "huggingface-hub>=2.4,<3",
  "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=9.2,<10", "httpx2>=2.16,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/narsat_inference"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "torch: needs PyTorch and TerraTorch (the 'prithvi' extra)",
]
