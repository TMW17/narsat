name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.13"

jobs:
  python:
    name: Python - lint, types, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NARSAT_TEST_DB_DSN: postgresql://narsat:narsat@127.0.0.1:5432/narsat_test
      NARSAT_TEST_S3_ENDPOINT: http://127.0.0.1:8333
      NARSAT_TEST_S3_ACCESS_KEY: narsat
      NARSAT_TEST_S3_SECRET_KEY: narsat-ci-secret
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra all --group dev

      - name: Format and lint
        run: |
          uv run --frozen ruff format --check src tests services
          uv run --frozen ruff check src tests services

      - name: Type check
        run: uv run --frozen mypy

      # The same PostGIS image as compose.yaml, built from infra/postgis.
      - name: Start PostgreSQL / PostGIS and SeaweedFS
        run: |
          docker build -t narsat-postgis:ci infra/postgis
          docker run -d --name postgis -p 5432:5432 \
            -e POSTGRES_PASSWORD=ci-superuser \
            -e NARSAT_DB_PASSWORD=narsat -e AIRFLOW_DB_PASSWORD=airflow \
            narsat-postgis:ci
          docker run -d --name seaweedfs -p 8333:8333 \
            -e AWS_ACCESS_KEY_ID=narsat -e AWS_SECRET_ACCESS_KEY=narsat-ci-secret \
            chrislusf/seaweedfs:4.53 server -dir=/data -s3 -s3.port=8333 -ip.bind=0.0.0.0
          for _ in $(seq 1 60); do
            docker exec postgis pg_isready -U postgres -d narsat -q && break
            sleep 2
          done
          docker exec postgis psql -U postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE narsat_test OWNER narsat"
          docker exec postgis psql -U postgres -d narsat_test -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION postgis" -c "CREATE EXTENSION citext"
          for _ in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:8333/ && break
            sleep 2
          done

      - name: Migrate the test database
        run: uv run --frozen narsat db upgrade
        env:
          NARSAT_DB_DSN: ${{ env.NARSAT_TEST_DB_DSN }}

      - name: Tests
        run: uv run --frozen pytest tests -q --cov=narsat --cov-report=term-missing:skip-covered

  inference:
    name: Inference service (contract tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/inference
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      # Without the "prithvi" extra the tests that need PyTorch are skipped; they build
      # a 300M-parameter model and are run locally (see services/inference/README.md).
      - run: uv venv && uv pip install --group dev .
      - run: uv run --no-project pytest tests -q

  airflow:
    name: Airflow DAG integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install Airflow with its published constraints
        run: |
          uv venv /tmp/airflow
          uv pip install --python /tmp/airflow/bin/python \
            "apache-airflow==3.4.0" apache-airflow-providers-standard pytest \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-${PYTHON_VERSION}.txt"
      - name: DAG tests
        run: /tmp/airflow/bin/python -m pytest orchestration/tests -q
        env:
          AIRFLOW_HOME: /tmp/airflow-home
          AIRFLOW__CORE__LOAD_EXAMPLES: "False"

  web:
    name: Web application
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  infrastructure:
    name: Compose, scripts and workflow files
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose.yaml with the example settings
        run: |
          # Every required value gets a placeholder; only the structure is checked here.
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose --profile orchestration --profile ml --profile observability config --quiet
      - name: ShellCheck
        run: shellcheck infra/postgis/initdb/*.sh infra/airflow/entrypoint.sh scripts/*.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  images:
    name: Build image ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: [python, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: platform, context: ., file: Dockerfile }
          - { name: postgis, context: infra/postgis, file: infra/postgis/Dockerfile }
          - { name: titiler, context: infra/titiler, file: infra/titiler/Dockerfile }
          - { name: web, context: web, file: web/Dockerfile }
          - { name: airflow, context: ., file: infra/airflow/Dockerfile }
          - { name: inference, context: services/inference, file: services/inference/Dockerfile }
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: narsat-${{ matrix.name }}:ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Smoke test
        run: |
          case "${{ matrix.name }}" in
            platform)  docker run --rm narsat-platform:ci narsat version ;;
            airflow)   docker run --rm narsat-airflow:ci version
                       docker run --rm --entrypoint /opt/narsat/bin/narsat narsat-airflow:ci version
                       docker run --rm --entrypoint /opt/narsat/bin/dbt narsat-airflow:ci --version ;;
            titiler)   docker run --rm narsat-titiler:ci python -c "import titiler.application.main" ;;
            inference) docker run --rm narsat-inference:ci python -c "import narsat_inference.app, torch, terratorch; print(torch.__version__)" ;;
            web)       docker run --rm narsat-web:ci nginx -t ;;
            postgis)   echo "PostGIS image already exercised by the python job" ;;
          esac
