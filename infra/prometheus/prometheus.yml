# Prometheus configuration of the NarSat stack (profile "observability").
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # REST API: request rates and latencies, plus the platform-health gauges it reads from
  # the database (freshness, mapping queue, data-quality failures).
  - job_name: narsat-api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # FIRMS poller: requests, rows, last successful poll per source.
  - job_name: narsat-poller
    static_configs:
      - targets: ["poller:9101"]

  # Kafka-to-lake consumer: messages, dead letters, batch time, consumer lag.
  - job_name: narsat-consumer
    static_configs:
      - targets: ["consumer:9102"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
