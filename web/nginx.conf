# NarSat web front end: the single-page application, plus the two back ends it needs on
# the same origin (no CORS): the REST API and TiTiler.
#
# Upstream names are resolved through Docker's DNS when a request arrives (variables in
# proxy_pass), so a restarted container with a new address is found again.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8000;
    set $titiler_upstream http://titiler:8000;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx drops these in any location that sets its own add_header,
    # so the locations below that add Cache-Control repeat them.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json
               application/geo+json application/vnd.mapbox-vector-tile image/svg+xml;

    # --- REST API ------------------------------------------------------------------
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1m;
    }

    # --- raster tiles ----------------------------------------------------------------
    # TiTiler reads whatever its `url` parameter names, so this public entry point only
    # lets through the exact query strings the API generates: a Cloud-Optimized GeoTIFF of
    # the NarSat lake (bucket "narsat", prefix "assets/"), one to three bands, a value
    # range and one of three colour maps. The whole query string is matched, not just the
    # `url` parameter: a repeated or percent-encoded parameter name could otherwise slip
    # a second URL past the check.
    location /titiler/cog/tiles/ {
        if ($args !~ "^url=s3%3A%2F%2Fnarsat%2Fassets%2F([A-Za-z0-9_-]+%2F)*[A-Za-z0-9_-]+\.tif(&bidx=[1-6]){1,3}&rescale=-?[0-9.]+,-?[0-9.]+(&colormap_name=(rdylgn_r|inferno|reds))?$") {
            return 403;
        }
        rewrite ^/titiler/(.*)$ /$1 break;
        proxy_pass $titiler_upstream;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        # Tiles of a finished event never change: cache them in the browser. Without
        # "always", nginx adds the header to successful responses only, so a refused or
        # missing tile is not cached.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
    }

    location = /titiler/healthz {
        rewrite ^/titiler/(.*)$ /$1 break;
        proxy_pass $titiler_upstream;
    }

    # Every other TiTiler endpoint (info, statistics, point queries, documentation).
    location /titiler/ {
        return 404;
    }

    # --- application ---------------------------------------------------------------
    # Hashed build assets can be cached for good; index.html must always be revalidated.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;

        # The map's web worker is an ES module (.mjs). The stock mime.types of nginx maps
        # only .js to JavaScript, and browsers refuse to start a module worker served as
        # application/octet-stream.
        location ~ \.mjs$ {
            types { }
            default_type text/javascript;
            try_files $uri =404;
        }
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options DENY always;
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
